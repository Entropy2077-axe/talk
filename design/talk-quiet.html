<body>
<div class="app" id="app" data-screen="chat">
  <nav class="rail" aria-label="主导航"><div class="wordmark">Talk</div><div id="rail-links"></div><div class="rail-spacer"></div><button class="icon" data-action="about" aria-label="设计说明" data-icon="info"></button><button class="nav-btn" data-nav="me" aria-label="我"><span class="avatar self">A</span></button></nav>
  <aside class="side" aria-label="会话列表"><header class="side-head"><h1>消息</h1><span class="mobile-title">Talk</span><button class="icon" data-action="contacts" aria-label="选择联系人" data-icon="compose"></button></header><label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索联系人" aria-label="搜索联系人" autocomplete="off"></label><p class="list-label" id="list-label">最近对话</p><div class="contact-list" id="contact-list"></div><div class="side-foot"><span></span>日常，都在这里。</div></aside>
  <main class="workspace" id="workspace">
    <section class="chat" id="chat" aria-label="聊天"><header class="chat-head"><button class="icon mobile-back" data-nav="messages" aria-label="返回消息列表" data-icon="back"></button><div id="head-avatar"></div><div class="person"><strong id="person-name"></strong><p id="person-status"></p></div><div class="head-actions"><button class="icon head-info" data-action="profile" aria-label="查看联系人" data-icon="user"></button><button class="icon" id="menu-toggle" data-action="menu" aria-label="聊天选项" aria-expanded="false" aria-controls="more-menu" data-icon="more"></button></div></header>
      <div class="popover more-menu" id="more-menu" hidden><button data-action="profile"><span data-icon="user"></span>联系人资料</button><button data-action="mute" id="mute-button" aria-pressed="false"><span data-icon="bell"></span><span id="mute-label">免打扰</span></button><button data-action="about"><span data-icon="info"></span>关于这份设计</button></div>
      <div class="transcript" id="transcript" tabindex="0" aria-label="聊天记录"><div class="conversation" id="conversation"></div></div><button class="jump" id="jump" hidden aria-label="回到最新消息" data-icon="down"></button>
      <div class="composer-wrap"><form class="composer" id="composer"><textarea id="draft" rows="1" placeholder="说点什么…" aria-label="消息内容"></textarea><div class="composer-tools"><button type="button" class="icon" data-action="emoji" id="emoji-toggle" aria-label="选择表情" aria-expanded="false" aria-controls="emoji-panel" data-icon="smile"></button><button type="button" class="icon" data-action="tools" id="tools-toggle" aria-label="更多聊天功能" aria-expanded="false" aria-controls="tools-panel" data-icon="plus"></button><span class="hint">不用想好再开口。</span><button class="icon send" type="submit" id="send" aria-label="发送消息" disabled data-icon="up"></button></div><div class="popover emoji-grid" id="emoji-panel" hidden></div><div class="popover" id="tools-panel" hidden><button type="button" data-action="insert"><span data-icon="quote"></span>引用上一条消息</button><button type="button" data-action="profile"><span data-icon="user"></span>看看对方的近况</button></div></form><div class="composer-foot"><span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span><button data-action="about">关于这份设计</button></div></div>
    </section>
    <section class="page" id="page" hidden></section>
  </main>
  <nav class="mobile-nav" id="mobile-nav" aria-label="底部导航"></nav>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog class="about" id="about" aria-labelledby="about-title"><div class="about-top"><h2 id="about-title">留一点空白。</h2><button class="icon" data-action="close-about" aria-label="关闭设计说明" data-icon="close"></button></div><p>Talk 的一份暖白风格草稿。保留熟悉的聊天感，让颜色退后，让对话往前。</p><div class="swatches"><span style="background:#f7f6f2"></span><span style="background:#e5ebe4"></span><span style="background:#356b66"></span><span style="background:#292824"></span></div><p class="caption">这里的人物和消息均为虚构。可以切换页面、搜索联系人和试发消息；回复为本地预设，刷新后恢复初始状态。没有连接模型或读取 Talk 数据。</p></dialog>
<script>
'use strict';
const paths={chat:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5A8.5 8.5 0 0 1 10.5 3h2a8.5 8.5 0 0 1 8.5 8.5Z"/><path d="M7 10h10M7 14h6"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 4v2"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/>',user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',compose:'<path d="M13 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-8M16 3l5 5M10 14l1-5 8-8 4 4-8 8Z"/>',back:'<path d="m14 6-6 6 6 6"/>',chevron:'<path d="m9 6 6 6-6 6"/>',more:'<circle cx="5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="19" cy="12" r=".8"/>',bell:'<path d="M5 17h14l-2-4V9a5 5 0 0 0-10 0v4ZM10 21h4"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14a4.5 4.5 0 0 0 8 0M8 9h.01M16 9h.01"/>',plus:'<path d="M12 5v14M5 12h14"/>',up:'<path d="M12 19V5m-6 6 6-6 6 6"/>',down:'<path d="M12 5v14m-6-6 6 6 6-6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',quote:'<path d="M10 5H4v7h6V5ZM20 5h-6v7h6V5ZM10 12c0 4-2 6-5 7M20 12c0 4-2 6-5 7"/>',book:'<path d="M12 5v16M12 5C8 2 4 3 2 4v15c4-2 7-1 10 2 3-3 6-4 10-2V4c-2-1-6-2-10 1Z"/>',shop:'<path d="M4 8h16l1 13H3ZM8 8V6a4 4 0 0 1 8 0v2"/>',box:'<path d="m3 7 9-5 9 5v10l-9 5-9-5ZM3 7l9 5 9-5M12 12v10M7.5 4.5l9 5"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',sliders:'<path d="M4 7h8M16 7h4M4 17h3M11 17h9"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',archive:'<path d="M3 3h18v5H3ZM5 8v13h14V8M10 12h4"/>',key:'<circle cx="8" cy="15" r="5"/><path d="m12 11 9-9M17 6l3 3M19 4l3 3"/>',work:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 12h18M10 12v3h4v-3"/>'};
function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.info)+'</svg>'}

function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const landscape='<svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" fill="#dddcca"/><circle cx="34" cy="13" r="6" fill="#f4efdf"/><path d="M0 31 19 12 43 48H0" fill="#8f9e89"/><path d="M15 48 34 23 48 35v13" fill="#586f60"/><path d="M9 48 24 29 35 48" fill="#b1baa2"/></svg>';
const contacts=[{id:'lin',name:'林间',status:'在家 · 整理今天拍的照片',preview:'那就慢慢走，天还没黑。',time:'17:42',art:true,initial:'林',messages:[['them','今天回来的时候，绕了一点远路。'],['them','河边那排树开始变黄了。有一棵只黄了半边，像是秋天还没想好。'],['mine','你这么一说，我也想出去走走了。'],['them','去吧，别带耳机。\n今天的风吹过树叶，声音很好听。'],['mine','好。等我把手头这点事做完。'],['them','那就慢慢走，天还没黑。']]},{id:'xu',name:'许知遥',status:'在书店 · 今天值晚班',preview:'给你留了靠窗的位置。',time:'16:08',initial:'遥',color:'sand',unread:2,messages:[['them','今天店里很安静，适合把读到一半的书看完。'],['mine','窗边的位置还在吗？'],['them','给你留了靠窗的位置。']]},{id:'zhou',name:'周屿',status:'在工作室 · 刚泡了咖啡',preview:'这张的光线刚刚好',time:'昨天',initial:'屿',color:'blue',messages:[['them','下午把上次的照片洗出来了。'],['mine','你最喜欢哪一张？'],['them','这张的光线刚刚好。下次见面带给你看。']]},{id:'summer',name:'夏末',status:'在厨房 · 试一道新菜',preview:'下次试试少放一点糖。',time:'星期一',initial:'夏',color:'rose',messages:[['them','今天第二次做戚风，终于没有塌。'],['mine','听起来值得庆祝一下。'],['them','下次试试少放一点糖。到时候你来尝尝。']]}];
const state={active:'lin',section:'messages',drafts:{},muted:new Set(),contactsOnly:false,detailOrigin:'discover',pending:new Set()};
const $=id=>document.getElementById(id);const current=()=>contacts.find(c=>c.id===state.active);
function avatar(c){return '<span class="avatar '+(c.color||'')+'">'+(c.art?landscape:escapeHtml(c.initial))+'</span>'}
const navItems=[['messages','chat','消息'],['contacts','users','联系人'],['discover','compass','发现'],['me','user','我']];
function navMarkup(items){return items.map(([id,ico,label])=>'<button class="nav-btn" data-nav="'+id+'" aria-label="'+label+'">'+icon(ico)+'<span>'+label+'</span></button>').join('')}
$('rail-links').innerHTML=navMarkup(navItems.slice(0,3));$('mobile-nav').innerHTML=navMarkup(navItems);
function updateNav(){document.querySelectorAll('[data-nav]').forEach(b=>{if(b.classList.contains('nav-btn'))b.setAttribute('aria-current',b.dataset.nav===state.section?'page':'false')})}
function renderList(){const q=$('search').value.trim().toLowerCase();const found=contacts.filter(c=>c.name.toLowerCase().includes(q));$('contact-list').innerHTML=found.length?found.map(c=>'<button class="contact" data-contact="'+c.id+'" aria-current="'+(c.id===state.active)+'">'+avatar(c)+'<span class="contact-copy"><span class="contact-line"><span class="contact-name">'+c.name+'</span><time>'+c.time+'</time></span><span class="preview"><p>'+escapeHtml(state.contactsOnly?c.status:c.preview)+'</p>'+(c.unread&&!state.contactsOnly?'<span class="unread">'+c.unread+'</span>':'')+'</span></span></button>').join(''):'<div class="empty-search">没有找到这位联系人<br><span class="small">试试「林间」或「许知遥」</span></div>';document.querySelector('.side-head h1').textContent=state.contactsOnly?'联系人':'消息';$('list-label').textContent=state.contactsOnly?'全部联系人 · 4':'最近对话'}
function closePopovers(){['more-menu','emoji-panel','tools-panel'].forEach(id=>$(id).hidden=true);['menu-toggle','emoji-toggle','tools-toggle'].forEach(id=>$(id).setAttribute('aria-expanded','false'))}
function renderMessages(bottom=true){const c=current();$('person-name').textContent=c.name;$('person-status').textContent=c.status;$('head-avatar').innerHTML=avatar(c);$('conversation').innerHTML='<div class="date">今天 · 17:36</div>'+c.messages.map(([who,text,time],i)=>{const continuation=who==='them'&&i>0&&c.messages[i-1][0]===who;return '<div class="message '+(who==='mine'?'mine':'')+(continuation?' continuation':'')+'">'+(continuation?'':who==='mine'?'<span class="avatar self">A</span>':avatar(c))+'<div class="message-body"><div class="bubble">'+escapeHtml(text)+'</div>'+(time||i===c.messages.length-1?'<time>'+(time||c.time)+'</time>':'')+'</div></div>'}).join('');if(bottom)scrollBottom();$('mute-button').setAttribute('aria-pressed',String(state.muted.has(c.id)));$('mute-label').textContent=state.muted.has(c.id)?'取消免打扰':'免打扰'}
function scrollBottom(){requestAnimationFrame(()=>{$('transcript').scrollTop=$('transcript').scrollHeight;$('jump').hidden=true})}
function saveDraft(){state.drafts[state.active]=$('draft').value}
function resizeDraft(){const el=$('draft');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,130)+'px';$('send').disabled=!el.value.trim()}
function openChat(id){saveDraft();state.active=id;state.section='messages';state.contactsOnly=false;current().unread=0;$('app').dataset.screen='chat';$('chat').hidden=false;$('page').hidden=true;$('draft').value=state.drafts[id]||'';closePopovers();renderList();renderMessages();resizeDraft();updateNav()}
function entry(title,desc,ico,key,value=''){return '<button class="entry" data-detail="'+key+'">'+icon(ico)+'<span class="entry-copy"><b>'+title+'</b>'+(desc?'<p>'+desc+'</p>':'')+'</span>'+(value?'<span class="entry-value">'+value+'</span>':'')+'<span class="chevron">'+icon('chevron')+'</span></button>'}
function navigate(section){saveDraft();state.section=section;closePopovers();updateNav();if(section==='messages'||section==='contacts'){state.contactsOnly=section==='contacts';$('app').dataset.screen='list';$('chat').hidden=false;$('page').hidden=true;renderList();return}$('app').dataset.screen='page';$('chat').hidden=true;$('page').hidden=false;$('page').scrollTop=0;if(section==='discover'){$('page').innerHTML='<header class="page-heading"><h1>发现</h1><p>对话之外，还有一些日常。</p></header><h2 class="section-title">朋友们</h2>'+entry('朋友圈','看看他们最近在做什么','sun','moments')+'<h2 class="section-title">故事与记忆</h2>'+entry('资料库','人物、世界，和共同经历过的事','book','library')+entry('存档','留住一个想再回去的时刻','archive','saves')+'<h2 class="section-title">日常生活</h2>'+entry('商城','','shop','shop')+entry('仓库','','box','warehouse')+entry('工作','','work','work')}else{$('page').innerHTML='<div class="profile"><span class="avatar self">A</span><div><h1>阿澈</h1><p>今天也有好好生活。</p></div></div><h2 class="section-title">聊天设置</h2>'+entry('模型与 API Key','','key','model','未连接')+entry('功能模块','','sliders','modules')+'<h2 class="section-title">偏好</h2>'+entry('外观','','sun','appearance','暖白')+entry('数据与存档','','archive','saves')+'<h2 class="section-title">关于</h2>'+entry('关于 Talk','','info','about')+'<p class="quote">有些话，留给熟悉的人。</p>'}}
const details={moments:['朋友圈','sun','林间 · 今天 16:52','绕路的时候，遇见了今年的第一片银杏叶。夹在书里了。'],library:['资料库','book','共同的记忆','上次说好：等天气凉一点，去河边走走。'],saves:['存档','archive','秋天的傍晚','4 位联系人 · 9 月 30 日 17:42\n这是一份示例存档，不会读写你的实际数据。'],shop:['商城','shop','一点心意','一本薄薄的诗集\n一包刚烘好的咖啡豆\n一张写了几句话的明信片'],warehouse:['仓库','box','留着下次见面','明信片 × 2\n咖啡豆 × 1'],work:['工作','work','今日安排','完成手头的工作，然后给自己留一点时间。'],model:['模型与 API Key','key','尚未连接模型','这份设计稿只演示界面，不需要填写密钥。\n正式应用的模型配置会在这里呈现。'],appearance:['外观','sun','暖白','温暖的浅色背景，淡灰绿色的气泡。\n正文 16 px · 标准行距'],profile:['联系人资料','user','','']};
function showDetail(key){if(key==='about'){showAbout();return}closePopovers();state.detailOrigin=$('app').dataset.screen==='chat'?'chat':state.section;$('app').dataset.screen='page';$('chat').hidden=true;$('page').hidden=false;$('page').scrollTop=0;const d=key==='profile'?['联系人资料','user',current().name,current().status+'\n喜欢留意生活里不起眼的小事，也喜欢听你说。']:details[key];let html='<button class="icon detail-back" data-action="detail-back" aria-label="返回上一页">'+icon('back')+'</button>';if(key==='modules'){html+='<header class="page-heading"><h1>功能模块</h1><p>只留下你想要的聊天方式。</p></header>'+[['读心','显示角色的内心想法'],['语音','听见对方的声音'],['主动聊天','偶尔收到一句问候']].map(([title,desc])=>'<button class="entry" data-toggle="'+title+'" aria-pressed="false"><span class="entry-copy"><b>'+title+'</b><p>'+desc+'</p></span><span class="toggle"></span></button>').join('')}else{html+='<header class="page-heading"><h1>'+d[0]+'</h1></header><div class="note-paper"><small>'+escapeHtml(d[2])+'</small><p style="white-space:pre-wrap">'+escapeHtml(d[3])+'</p></div>';if(key==='appearance')html+='<div class="swatches"><span style="background:#f7f6f2"></span><span style="background:#e5ebe4"></span><span style="background:#356b66"></span></div>';html+='<p class="detail-copy small">界面预览 · 示例内容</p>'}$('page').innerHTML=html}
let toastTimer;function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function showAbout(){closePopovers();if(!$('about').open)$('about').showModal()}
function togglePanel(id,trigger){const opening=$(id).hidden;closePopovers();$(id).hidden=!opening;$(trigger).setAttribute('aria-expanded',String(opening));if(opening)$(id).querySelector('button').focus()}
function submitMessage(event){event.preventDefault();const text=$('draft').value.trim();if(!text)return;const c=current(),id=c.id;const time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});c.messages.push(['mine',text,time]);c.preview=text;c.time=time;$('draft').value='';state.drafts[id]='';resizeDraft();closePopovers();renderMessages();renderList();if(state.pending.has(id))return;state.pending.add(id);setTimeout(()=>{state.pending.delete(id);const replies=['嗯，我在听。你慢慢说。','好呀。今天就按自己的节奏来。','那我们就把这件小事，留在今天。'];const reply=replies[c.messages.filter(m=>m[0]==='mine').length%replies.length];c.messages.push(['them',reply,time]);c.preview=reply;if(state.active===id){const t=$('transcript');const near=t.scrollHeight-t.scrollTop-t.clientHeight<90;renderMessages(near);if(!near)$('jump').hidden=false}else c.unread=(c.unread||0)+1;renderList()},900)}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b){if(!event.target.closest('.popover'))closePopovers();return}if(b.dataset.contact){openChat(b.dataset.contact);return}if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.detail){showDetail(b.dataset.detail);return}if(b.dataset.emoji){$('draft').value+=b.dataset.emoji;saveDraft();resizeDraft();closePopovers();$('draft').focus();return}if(b.dataset.toggle){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));toast(b.dataset.toggle+(on?'已开启':'已关闭')+'（演示）');return}switch(b.dataset.action){case'about':showAbout();break;case'close-about':$('about').close();break;case'contacts':navigate('contacts');$('search').focus();break;case'profile':showDetail('profile');break;case'detail-back':state.detailOrigin==='chat'?openChat(state.active):navigate(state.detailOrigin);break;case'menu':togglePanel('more-menu','menu-toggle');break;case'emoji':togglePanel('emoji-panel','emoji-toggle');break;case'tools':togglePanel('tools-panel','tools-toggle');break;case'mute':state.muted.has(state.active)?state.muted.delete(state.active):state.muted.add(state.active);renderMessages(false);closePopovers();toast(state.muted.has(state.active)?'已开启免打扰（演示）':'已取消免打扰');break;case'insert':{const last=current().messages.filter(m=>m[0]==='them').at(-1);$('draft').value='「'+last[1]+'」\n'+$('draft').value;saveDraft();resizeDraft();closePopovers();$('draft').focus();break}default:if(!b.closest('.popover'))closePopovers()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const trigger=!$('more-menu').hidden?'menu-toggle':!$('emoji-panel').hidden?'emoji-toggle':!$('tools-panel').hidden?'tools-toggle':null;closePopovers();if(trigger)$(trigger).focus()}});
$('search').addEventListener('input',renderList);$('composer').addEventListener('submit',submitMessage);$('draft').addEventListener('input',()=>{saveDraft();resizeDraft()});$('draft').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit()}});$('transcript').addEventListener('scroll',()=>{const t=$('transcript');$('jump').hidden=t.scrollHeight-t.scrollTop-t.clientHeight<100});$('jump').addEventListener('click',scrollBottom);$('emoji-panel').innerHTML=['🙂','☕','🌿','🌙','🍂','🤍','🙌','👀'].map(e=>'<button type="button" data-emoji="'+e+'" aria-label="插入 '+e+'">'+e+'</button>').join('');
function syncHeight(){document.documentElement.style.setProperty('--vh',(window.visualViewport?.height||window.innerHeight)+'px')}syncHeight();window.addEventListener('resize',syncHeight);window.visualViewport?.addEventListener('resize',syncHeight);hydrate();renderList();renderMessages();updateNav();
</script>
